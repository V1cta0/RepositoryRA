<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aula 02 Realidade Aumentada</title>
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
  </head>
  <body>
    <h1>Teste WebAR- Aula 02</h1>
    <p>Se esta página apareceu no celular, o GitHub Pages esta funcionando corretamente.</p>

    <a-scene mindar-image="imageTargetSrc: https://jsdelivr.net;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      
      
        <!-- Seu plano azul semi-transparente de fundo -->
        <a-plane color="blue" opacity="0.5" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
        
        <!-- Seu cubo do código original posicionado em cima do plano -->
        <a-box position="0 0 0.25" rotation="0 0 0" scale="0.5 0.5 0.5" material="color: red;"></a-box>
      
    </a-scene>
  </body>
</html>
