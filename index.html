<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 02 Realidade Aumentada</title>
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <h1>Teste WebAR - Aula 02</h1>
    <p>Se esta página apareceu no celular, o GitHub Pages está funcionando corretamente.</p>

    <a-scene mindar-image="imageTargetSrc: ./card.mind;" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        
        
            <a-box position="0 0 0.25" rotation="0 0 0" scale="0.5 0.5 0.5" material="color: blue;"></a-box>
        
    </a-scene>
</body>
</html>
